name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[all,dev]" reportlab
      - name: Unit tests
        run: pytest -q
      - name: Evaluation gate (offline baseline)
        run: |
          eka ingest data/sample_docs --reset
          eka eval --cases eval/cases.jsonl --report reports --min-accuracy 0.9
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: eval-report
          path: reports/
