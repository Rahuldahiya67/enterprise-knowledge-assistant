[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Production-style RAG assistant over enterprise documents: hybrid retrieval, re-ranking, citations, streaming API and an evaluation suite."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rahul Dahiya" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "pypdf>=4.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
mongo = ["pymongo>=4.7"]
all = ["openai>=1.30", "anthropic>=0.30", "pymongo>=4.7"]
dev = ["pytest>=8"]

[project.scripts]
eka = "eka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
